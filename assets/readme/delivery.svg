<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Discovery, build, handover</title>
  <desc id="desc">Trebuchet Dynamics delivery sequence. Discovery defines the spec, risks, and estimate. The founder leads the build. The client owns the source and release process from day one, not only at handover.</desc>
  <rect width="1200" height="190" fill="#0a0a0f"/>
  <g id="delivery-steps" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#eeede8" font-size="56" font-weight="600">
    <text x="56" y="132">Discovery</text>
    <text x="480" y="132">Build</text>
    <text x="834" y="132">Handover</text>
  </g>
  <g id="step-numbers" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7dd3fc">
    <text x="56" y="64">01</text>
    <text x="480" y="64">02</text>
    <text x="834" y="64">03</text>
  </g>
  <g id="sequence" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M380 112 H432 M422 102 L432 112 L422 122"/>
    <path d="M734 112 H786 M776 102 L786 112 L776 122"/>
  </g>
</svg>
